{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-header"><h3 class="mb-0">Brisanje CV stavke</h3></div>
      <div class="card-body">
        <p>Da li sigurno zelis da obrises stavku <strong>{{ object.title }}</strong>?</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Obrisi</button>
          <a href="{% url 'my_employee_profile' %}#cv" class="btn btn-outline-secondary">Odustani</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
