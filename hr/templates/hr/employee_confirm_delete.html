{% extends "base.html" %}

{% block content %}
<div class="row">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-header">
        <h2 class="mb-0">{{ title }}</h2>
      </div>
      <div class="card-body">
        <p>Da li sigurno zelis da obrises zaposlenog <strong>{{ employee }}</strong>?</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Obrisi</button>
            <a href="{% url 'employee_detail' employee.pk %}" class="btn btn-outline-secondary">Odustani</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
