{% load collection_tables %}
{% collection_columns columns kind partner presentation as display_columns %}
<div class="table-responsive">
<table class="{% if presentation == 'pretty' %}table table-striped table-hover{% else %}display compact collections-simple-table{% endif %}{% if partner %} collections-detail-table{% endif %} collections-table" data-kind="{{ kind }}" data-url="{% url 'potrazivanja:table_data' %}" data-snapshot="{{ snapshot.pk }}" data-partner="{{ partner.pk }}" data-center="{{ selected_center }}" style="width:100%">
  <thead><tr>{% for column in display_columns %}<th data-column="{{ column.index }}" title="{{ column.title }}">{{ column.title }}</th>{% endfor %}</tr></thead><tbody></tbody>
</table></div>
