            <!-- Napomene -->
            <div class="tab-pane fade" id="napomene">
                <div class="d-flex justify-content-between align-items-center">
                    <h4>Napomene</h4>
                    {% if can_edit_naplata_detail %}
                    <a href="{% url 'naplata:dodaj_napomenu' partner.2 partner.3 %}" class="text-success" style="font-size: 1.05em;">
                        <i class="mdi mdi-plus-box"></i> Dodaj napomenu
                    </a>
                    {% endif %}
                </div>
                <table class="table table-striped table-sm">
                    <tr>
                        <th>Napomena</th>
                        <th>Veliki</th>
                        {% if can_edit_naplata_detail %}<th class="d-flex justify-content-end align-items-center">Akcije</th>{% endif %}
                    </tr>
                    {% for napomena in napomene %}
                    <tr>
                        <td>{{ napomena.napomene }}</td>
                        <td>{{ napomena.veliki }}</td>
                        {% if can_edit_naplata_detail %}
                        <td class="d-flex justify-content-end align-items-center">
                            <a href="{% url 'naplata:izmeni_napomenu' napomena.id %}" class="text-success d-flex align-items-center me-3">
                                <i class="fas fa-edit"></i>
                            </a>
                            <span class="mx-2" style="border-left: 1px solid #ccc; height: 20px;"></span>
                            <form action="{% url 'naplata:obrisi_napomenu' napomena.id %}" method="post" class="d-flex align-items-center" style="margin: 0; padding: 0;">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-link text-danger p-0 m-0 d-flex align-items-center"
                                        style="border: none; background: none;"
                                        onclick="return confirm('Da li ste sigurni da želite da uklonite ovu napomenu?');">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </form>
                        </td>
                        {% endif %}
                    </tr>
                    {% endfor %}
                </table>
            </div>
