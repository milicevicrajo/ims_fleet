{% load static %}
<aside class="left-sidebar" data-sidebarbg="skin5">
  <div class="scroll-sidebar">
    <nav class="sidebar-nav">
      <ul id="sidebarnav" class="pt-4">
        {% if knjizenje_permissions.racuni %}<li class="sidebar-item">
          <a class="sidebar-link waves-effect waves-dark sidebar-link" href="{% url 'knjizenje:racuni' %}">
            <i class="mdi mdi-receipt-text-check-outline"></i><span class="hide-menu">Fiskalni računi</span>
          </a>
        </li>{% endif %}
        {% if knjizenje_gorivo %}
        <li class="sidebar-item"><span class="sidebar-link text-uppercase small opacity-75" style="pointer-events:none">
          <i class="mdi mdi-gas-station"></i><span class="hide-menu">Gorivo — izveštaji</span></span></li>
        {% for s in knjizenje_gorivo %}<li class="sidebar-item">
          <a class="sidebar-link waves-effect waves-dark sidebar-link" href="{{ s.url }}">
            <i class="mdi {{ s.ikona }}"></i><span class="hide-menu">{{ s.naziv }}</span>
          </a>
        </li>{% endfor %}
        {% endif %}
      </ul>
    </nav>
  </div>
</aside>
