<div class="row g-3 mb-3">
  <div class="col-md-4"><div class="card h-100"><div class="finance-stat finance-stat-revenue"><span class="finance-stat-icon"><i class="mdi mdi-trending-up" aria-hidden="true"></i></span><div><div class="finance-stat-label">Prihodi · RSD</div><div class="finance-stat-amount{% if totals.revenue < 0 %} text-danger{% endif %}">{{ totals.revenue|floatformat:"2g" }}</div></div></div></div></div>
  <div class="col-md-4"><div class="card h-100"><div class="finance-stat finance-stat-expense"><span class="finance-stat-icon"><i class="mdi mdi-trending-down" aria-hidden="true"></i></span><div><div class="finance-stat-label">Direktni rashodi · RSD</div><div class="finance-stat-amount{% if totals.expense < 0 %} text-danger{% endif %}">{{ totals.expense|floatformat:"2g" }}</div></div></div></div></div>
  <div class="col-md-4"><div class="card h-100"><div class="finance-stat finance-stat-result"><span class="finance-stat-icon"><i class="mdi mdi-scale-balance" aria-hidden="true"></i></span><div><div class="finance-stat-label">Direktni rezultat · RSD</div><div class="finance-stat-amount{% if totals.result < 0 %} text-danger{% endif %}">{{ totals.result|floatformat:"2g" }}</div></div></div></div></div>
</div>
