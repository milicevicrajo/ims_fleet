{% comment %}Excel i PDF (A4 strana za štampu) za ekran Finansija. `upit`: parametri ekrana; `dodatak`: npr. „&report=overview”.{% endcomment %}
{% if can_export %}<a class="btn {{ klasa|default:'btn-outline-light' }}" data-no-preloader href="{% url 'finansije:export' %}?{{ upit }}{{ dodatak }}"><i class="mdi mdi-file-excel me-1" aria-hidden="true"></i>Excel</a><a class="btn {{ klasa|default:'btn-outline-light' }}" data-no-preloader target="_blank" rel="noopener" href="{% url 'finansije:export' %}?{{ upit }}{{ dodatak }}&amp;format=pdf" title="A4 strana za štampu; u prozoru za štampu izaberite „Sačuvaj kao PDF”"><i class="mdi mdi-file-pdf-box me-1" aria-hidden="true"></i>PDF</a>{% endif %}
