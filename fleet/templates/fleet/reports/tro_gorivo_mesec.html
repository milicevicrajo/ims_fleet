{% extends "base.html" %}
{% load humanize %}
{% load static %}
{% block content %}
<h1 class="my-4">Promet goriva po mesecima</h1>
<div class="row align-items-top">
    <!--==========================================================-->
    <!-------                  COLUMN START                   ------>
    <!--==========================================================-->
    <div class="col-lg-8">

    <table id="GorivoMesec" class="display compact" data-reports-dt="true">
        <thead>
            <tr>
                <th>Godina</th>
                <th>Mesec</th>
                <th>Kategorija</th>
                <th>Iznos</th>
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
                <tr>
                    <td>{{ row.god }}</td>
                    <td>{{ row.mesec }}</td>
                    <td>{{ row.kategorija }}</td>
                    <td>{{ row.iznos }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.ReportsDT) {
      ReportsDT('#GorivoMesec', {
        exportTitle: 'Promet goriva po mesecima',
        order: [[0, 'desc'], [1, 'desc']],
        pageLength: 25,
        numericColumns: [3]
      });
    }
  });
</script>

{% endblock %}
