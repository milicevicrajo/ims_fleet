{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title">{{ title }}</h3>
        <p>Da li ste sigurni da želite da obrišete vozilo <strong>{{ vehicle }}</strong>?</p>
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next_url }}">
          <div class="d-flex justify-content-end gap-2">
            <a href="{{ next_url }}" class="btn btn-outline-secondary">Odustani</a>
            <button type="submit" class="btn btn-danger">Obriši</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
