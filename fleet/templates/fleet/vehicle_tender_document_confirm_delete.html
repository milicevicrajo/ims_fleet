{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <h2 class="card-title">{{ title }}</h2>
        <p>Da li ste sigurni da zelite da obrisete dokument <strong>{{ document.title }}</strong> vezan za vozilo {{ document.vehicle }}?</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Obrisi</button>
            <a href="{% url 'vehicle_tender_document_detail' document.pk %}" class="btn btn-outline-secondary">Odustani</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
