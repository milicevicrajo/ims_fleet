{% extends "base.html" %}
{% block content %}
<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">{{ title }}</h2>
    <a href="{% url 'servicetype_create' %}" class="btn btn-primary">
      + Novi tip
    </a>
  </div>

  <table class="table table-striped table-bordered align-middle">
    <thead class="table-light">
      <tr>
        <th style="width: 25%;">Naziv tipa servisa</th>
        <th>Opis</th>
        <th style="width: 20%;" class="text-center">Akcije</th>
      </tr>
    </thead>
    <tbody>
      {% for servicetype in service_types %}
        <tr>
          <td>
            <a href="{% url 'servicetype_detail' servicetype.pk %}">
              {{ servicetype.name }}
            </a>
          </td>
          <td>{{ servicetype.description|default:"—" }}</td>
          <td class="text-center">
            <a href="{% url 'servicetype_update' servicetype.pk %}" class="btn btn-sm btn-warning">
              <i class="bi bi-pencil-square"></i> Izmeni
            </a>
            <a href="{% url 'servicetype_delete' servicetype.pk %}" 
               class="btn btn-sm btn-danger"
               onclick="return confirm('Da li ste sigurni da želite da obrišete tip: {{ servicetype.name }}?');">
              <i class="bi bi-trash"></i> Obriši
            </a>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3" class="text-center text-muted">
            Nema unetih tipova servisa.
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
