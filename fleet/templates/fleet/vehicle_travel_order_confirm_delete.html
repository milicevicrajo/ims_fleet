{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title">{{ title }}</h3>
        <p>Da li ste sigurni da zelite da obrisete putni nalog <strong>{{ travel_order.pn_number }}</strong>?</p>
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next|default:request.GET.next }}">
          <div class="d-flex justify-content-end gap-2">
            <a href="{{ next|default:request.GET.next|default:request.META.HTTP_REFERER|default:'/' }}" class="btn btn-outline-secondary">Odustani</a>
            <button type="submit" class="btn btn-danger">Obrisi</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
