{# templates/fleet/konta_list.html #}
{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="card-title mb-0">Konta vozila</h5>
      <a class="btn btn-primary btn-sm" href="{% url 'konta_create' %}">+ Novo</a>
    </div>

    <table id="DataTable" class="table table-sm table-striped">
      <thead><tr><th>Konto</th><th>Naziv</th><th class="text-end">Akcije</th></tr></thead>
      <tbody>
        {% for k in konta %}
        <tr>
          <td>{{ k.knt }}</td>
          <td>{{ k.naz_knt }}</td>
          <td class="text-end">
            <a class="btn btn-warning btn-sm" href="{% url 'konta_update' k.pk %}">Izmeni</a>
            <a class="btn btn-outline-danger btn-sm" href="{% url 'konta_delete' k.pk %}">Obriši</a>
          </td>
        </tr>
        {% empty %}
        <tr><td colspan="3">Nema podataka.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
