{% extends "base.html" %}
{% load widget_tweaks %}

{% block content %}
<div class="row">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="mb-0">{{ title }}</h3>
        <a class="btn btn-outline-secondary btn-sm" href="{% url 'nabavka:case_list' %}">Nazad</a>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
            {% for error in field.errors %}
              <div class="invalid-feedback d-block">{{ error }}</div>
            {% endfor %}
          </div>
          {% endfor %}
          <button class="btn btn-primary" type="submit">
            <i class="mdi mdi-content-save"></i> {{ submit_button_label|default:"Sačuvaj" }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
