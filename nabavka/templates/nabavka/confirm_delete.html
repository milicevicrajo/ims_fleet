{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header"><h3 class="mb-0">Potvrda brisanja</h3></div>
      <div class="card-body">
        <p>Da li želite da obrišete: <strong>{{ object }}</strong>?</p>
        <form method="post">
          {% csrf_token %}
          <button class="btn btn-danger" type="submit">Obriši</button>
          <a class="btn btn-outline-secondary" href="{% url 'nabavka:case_detail' object.pk %}">Odustani</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
