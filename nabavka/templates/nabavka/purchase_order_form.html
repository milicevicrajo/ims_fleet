{% extends "base.html" %}

{% block content %}
<div class="row">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header"><h3 class="mb-0">{{ title }}</h3></div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
              <div class="invalid-feedback d-block">{{ error }}</div>
            {% endfor %}
          </div>
          {% endfor %}
          <button class="btn btn-primary" type="submit">{{ submit_button_label|default:"Sačuvaj" }}</button>
          <a class="btn btn-outline-secondary" href="{% url 'nabavka:purchase_order_list' %}">Nazad</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
