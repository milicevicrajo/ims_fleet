{% comment %}Izgled detalja fiskalnog računa — Nabavka i Isplate (od 07.10.2026.).{% endcomment %}
<style>
  .invoice-hero { border-radius: 8px; background: linear-gradient(135deg, #14395b 0%, #1f6f8b 48%, #2f8f6f 100%);
    color: #fff; padding: 20px 24px; margin-bottom: 16px; box-shadow: 0 10px 26px rgba(20, 57, 91, 0.18); }
  .invoice-hero h1 { font-size: 1.5rem; margin: 0; }

  .fiskalni-obrada .row { margin-right: -6px; margin-left: -6px; row-gap: 12px; }

  .fiskalni-obrada .form-text { display: block; margin-top: 6px; font-size: .8rem; color: #6b7785; }
  .fiskalni-prekidaci { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; margin: 16px 0; }

  /* Tema je Bootstrap 4: prekidac ima sopstveni izgled, a ostaje izvorni checkbox. */

  .fiskalni-prekidac .form-check-input::before { content: ""; position: absolute; top: 2px; left: 2px;

  .fiskalni-prekidac.garaza.ukljucen .ikona { background: #fff0cc; color: #7a4d00; }
  .fiskalni-prekidac.garaza.ukljucen .form-check-input:checked { background-color: #d99a00; border-color: #d99a00; }
  .fiskalni-garaza { border: 1px dashed #f1d28d; background: #fffcf5; border-radius: 8px; padding: 12px 14px 14px; margin-bottom: 16px; }
  .fiskalni-garaza > header { font-weight: 600; font-size: .85rem; color: #7a4d00; margin-bottom: 10px; }
  .fiskalni-sifra-vozila { font-size: .82rem; margin-top: 8px; color: #7a4d00; }
  .fiskalni-obrada-dno { display: flex; justify-content: flex-end; border-top: 1px solid #eef0f4; padding-top: 12px; margin-top: 4px; }

</style>
