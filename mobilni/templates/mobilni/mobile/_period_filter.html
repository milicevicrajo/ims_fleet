<form method="get" class="fleet-list-filter d-flex flex-wrap align-items-end gap-2 mb-3">
  <div>
    <label class="form-label" for="mobile-period">Period</label>
    <select id="mobile-period" name="period" class="form-control" onchange="var p=this.value.split('-'); this.form.year.value=p[0]||''; this.form.month.value=p[1]||'';">
      {% for year, month in periods %}
        <option value="{{ year }}-{{ month }}" {% if year == selected_year and month == selected_month %}selected{% endif %}>
          {{ month|stringformat:"02d" }}/{{ year }}
        </option>
      {% endfor %}
    </select>
    <input type="hidden" name="year" value="{{ selected_year|default:'' }}">
    <input type="hidden" name="month" value="{{ selected_month|default:'' }}">
  </div>
  <div class="flex-grow-1" style="min-width: 220px;">
    <label class="form-label" for="mobile-search">Pretraga</label>
    <input id="mobile-search" type="search" name="q" value="{{ q }}" class="form-control" placeholder="Broj, korisnik, paket">
  </div>
  <button type="submit" class="btn btn-primary">
    <i class="mdi mdi-magnify"></i> Prikazi
  </button>
</form>
