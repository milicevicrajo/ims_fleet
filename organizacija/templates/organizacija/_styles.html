{% comment %}
Stilovi stabla organizacije. Sve je pod `.org-page` da ne dodirne ostale ekrane —
ranije je nepazljivo pisan selektor h3 pokvario razmake na svim karticama detalja vozila.
{% endcomment %}
<style>
.org-page { padding-bottom: 24px; }
.org-page .org-kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.org-page .org-hero-metrics { display: flex; gap: 18px; flex-wrap: wrap; }
.org-page .org-hero-metrics > div { text-align: center; min-width: 74px; }
.org-page .org-hero-metrics strong { display: block; font-size: 22px; line-height: 1.1; }
.org-page .org-hero-metrics small { font-size: 11px; opacity: .75; }

.org-page .org-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  justify-content: space-between; margin: 16px 0 10px; }
.org-page .org-search { display: flex; gap: 8px; flex: 1 1 320px; }
.org-page .org-search input { flex: 1 1 auto; min-width: 0; padding: 7px 12px;
  border: 1px solid #ced4da; border-radius: 6px; }
.org-page .org-actions { display: flex; gap: 8px; }
.org-page .org-hero-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.org-page .org-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; justify-content: flex-end; }
.org-page .org-filter { display: inline-flex; align-items: center; gap: 4px;
  font-family: inherit; font-size: 12px; line-height: 1.5; padding: 3px 11px; border-radius: 12px; cursor: pointer;
  border: 1px solid #ced4da; background: #fff; color: #4a5468; text-decoration: none; white-space: nowrap; }
.org-page .org-filter:hover { border-color: #0d6efd; color: #0d6efd; }
.org-page .org-filter:focus-visible { outline: 2px solid #0d6efd; outline-offset: 2px; }
.org-page .org-filter.is-active { background: #0d6efd; border-color: #0d6efd; color: #fff; font-weight: 600; }
.org-page .org-note { font-size: 13px; color: #6c757d; margin: 6px 0 12px; }

.org-page .org-tree { border: 1px solid #e3e6ec; border-radius: 8px; overflow: hidden; background: #fff; }
.org-page details { border-top: 1px solid #eef0f4; }
.org-page .org-tree > details:first-child { border-top: 0; }
.org-page summary { display: flex; align-items: center; gap: 10px; cursor: pointer;
  padding: 10px 14px; list-style: none; user-select: none; }
.org-page summary::-webkit-details-marker { display: none; }
.org-page summary:hover { background: #f6f8fb; }
.org-page summary:focus-visible { outline: 2px solid #0d6efd; outline-offset: -2px; }

.org-page .org-chevron { flex: 0 0 auto; width: 0; height: 0; border-left: 6px solid #8a94a6;
  border-top: 5px solid transparent; border-bottom: 5px solid transparent; transition: transform .12s; }
.org-page details[open] > summary .org-chevron { transform: rotate(90deg); }

.org-page .org-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px; padding: 1px 7px; border-radius: 4px; background: #eef1f6; color: #37415a; }
.org-page .org-code-1 { background: #dfe8ff; color: #1b3a8a; font-weight: 600; }
.org-page .org-code-2 { background: #e6f2e8; color: #1f5d33; }
.org-page .org-code-3 { background: #f1f3f7; }
.org-page .org-name { flex: 1 1 auto; min-width: 0; }
.org-page .org-unnamed { color: #9aa3b2; font-size: 13px; }
.org-page .org-count { flex: 0 0 auto; font-size: 12px; color: #6c757d; white-space: nowrap; }

.org-page .org-center > summary { background: #fafbfd; font-size: 15px; }
.org-page .org-children { padding: 0 0 0 22px; }
.org-page .org-unit > summary { padding-left: 10px; }

.org-page .org-jobs { list-style: none; margin: 0; padding: 0 0 8px 32px; }
.org-page .org-jobs li { display: flex; align-items: center; gap: 10px; padding: 5px 14px 5px 0; }
.org-page .org-jobs li + li { border-top: 1px dotted #eef0f4; }
.org-page .org-jobs li.is-match { background: #fff6dd; border-radius: 4px; }
.org-page .org-jobs li.is-inactive .org-name { color: #98a1b0; }

.org-page .org-badges { flex: 0 0 auto; display: flex; gap: 6px; }
.org-page .org-badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid transparent; }
.org-page .org-badge-profit { background: #e6f2e8; color: #1f5d33; border-color: #bcdcc5; }
.org-page .org-badge-nonprofit { background: #eef1f6; color: #4a5468; border-color: #d6dbe5; }
.org-page .org-badge-unknown { background: #fff4e5; color: #8a5a12; border-color: #f0d6ad; }
.org-page .org-badge-inactive { background: #fdecec; color: #8d2e2e; border-color: #f2c6c6; }
.org-page .org-badge-suggest { background: #eef4ff; color: #2f4f9a; border-color: #c9d8f7; cursor: help; }
.org-page .org-badge-group { background: #f3eefc; color: #5b3c96; border-color: #dccff3; }
.org-page .org-person { font-size: 12px; margin-left: 6px; color: #1f5d33; text-decoration: none; white-space: nowrap; }
.org-page .org-person:hover { text-decoration: underline; }
.org-page .org-person.is-former { color: #6c757d; }
.org-page .org-part { padding: 8px 14px; background: #eef1f6; color: #37415a; font-size: 12px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; border-top: 1px solid #e3e6ec; }
.org-page .org-tree > .org-part:first-child { border-top: 0; }
.org-page .org-part-no { opacity: .6; margin-right: 2px; }
.org-page .org-part .org-count { text-transform: none; letter-spacing: 0; font-weight: 400; }

.org-page .org-unresolved { margin-top: 22px; }
.org-page .org-unresolved h2 { font-size: 17px; margin-bottom: 4px; }
.org-page .org-unresolved-group { border: 1px solid #e3e6ec; border-radius: 8px;
  margin-bottom: 8px; background: #fff; }
.org-page .org-unresolved-group table { margin: 0; }
.org-page .org-run { margin-top: 16px; font-size: 12px; color: #6c757d; }

@media (max-width: 640px) {
  .org-page .org-count { display: none; }
  .org-page .org-children { padding-left: 12px; }
  .org-page .org-jobs { padding-left: 16px; }
  .org-page .org-jobs li { flex-wrap: wrap; }
}

.org-page a.org-code { text-decoration: none; }
.org-page a.org-code:hover { text-decoration: underline; }

.org-page .org-path { display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; margin-top: 6px; }
.org-page .org-path-sep { color: #9aa3b2; }

.org-page .org-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 14px; margin-top: 16px; }
.org-page .org-card { background: #fff; border: 1px solid #e3e6ec; border-radius: 8px;
  padding: 14px 16px; margin-bottom: 14px; }
.org-page .org-cards .org-card { margin-bottom: 0; }
.org-page .org-card h2 { font-size: 16px; margin: 0 0 10px; }
.org-page .org-card h3 { font-size: 14px; margin: 14px 0 6px; }
.org-page .org-card table { margin-bottom: 0; }
.org-page .org-card th { width: 34%; font-weight: 600; color: #4a5468; }
.org-page .org-note-inline { display: block; color: #6c757d; font-size: 12px; }
.org-page .org-disagree { color: #8a5a12; background: #fff4e5; border: 1px solid #f0d6ad;
  border-radius: 4px; padding: 4px 8px; margin-top: 4px; }

.org-page .org-details-card { padding: 0; }
.org-page .org-details-card > summary { padding: 12px 16px; }
.org-page .org-details-card > summary h2 { margin: 0; flex: 1 1 auto; }
.org-page .org-details-card > .table-responsive,
.org-page .org-details-card > h3,
.org-page .org-details-card > table,
.org-page .org-details-card > p { padding: 0 16px; }
.org-page .org-details-card > p:last-child { padding-bottom: 14px; }
.org-page .org-details-card tr.is-current { background: #f2f8f4; }

.org-page .org-child-list { padding-left: 0; }
.org-page .org-child-list li { padding-left: 0; }
</style>
